<!-- pay_paytm.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pay via Paytm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .payment-container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 16px;
            margin: 10px 0;
            color: #444;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00b9f1;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #009bd1;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h2>Enter your Paytm Wallet Details</h2>
        <p><strong>Event:</strong> {{ event.eventname }}</p>
        <p><strong>Amount:</strong> ₹{{ event.amount }}</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Pay Now</button>
        </form>
    </div>
</body>
</html>
