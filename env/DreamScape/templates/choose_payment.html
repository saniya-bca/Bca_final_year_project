{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Payment Method</title>
    <link rel="stylesheet" href="{% static 'css/payment.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="payment-container">
        <h1>Choose a Payment Method</h1>
        <p class="event-details">
            <strong>Event:</strong> {{ event.eventname }}<br>
            <strong>Amount:</strong> ₹{{ event.amount }}
        </p>

        <div class="payment-methods">
            <a href="{% url 'pay_now' event.id %}?method=upi" class="method upi">
                <i class="fas fa-mobile-alt"></i> UPI
            </a>
            <a href="{% url 'pay_now' event.id %}?method=card" class="method card">
                <i class="fas fa-credit-card"></i> Credit/Debit Card
            </a>
            <a href="{% url 'pay_now' event.id %}?method=netbanking" class="method netbanking">
                <i class="fas fa-university"></i> Net Banking
            </a>
            <a href="{% url 'pay_now' event.id %}?method=paytm" class="method paytm">
                <i class="fab fa-paypal"></i> Paytm Wallet
            </a>
        </div>
    </div>
</body>
</html>
