
    <!-- Internal CSS Starts Here -->
    <style>
      body {
          font-family: 'Segoe UI', sans-serif;
          background-color: #ff8eae;
          padding: 40px;
      }

      form {
          max-width: 700px;
          margin: auto;
          background-color: white;
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      }

      .form-group label {
          font-weight: 600;
          margin-bottom: 8px;
          display: block;
      }

      .form-control {
          width: 100%;
          padding: 10px 14px;
          border-radius: 8px;
          border: 1px solid #ced4da;
          font-size: 15px;
          margin-bottom: 20px;
      }

      .form-control:focus {
          border-color: #80bdff;
          outline: none;
          box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
      }

      .btn-success {
          padding: 12px 24px;
          font-size: 16px;
          border-radius: 8px;
      }
      .btn-success:hover {
    background-color: #6cb4d3; /* Darker green */
    color: #fff;
    transition: background-color 0.3s ease, color 0.3s ease;
    box-shadow: 0 0 10px rgba(33, 136, 56, 0.4);
}

      .topcorner {
          position: absolute;
          top: 80px;
          right: 20px;
          z-index: 1000;
      }

      .alert {
          border-radius: 6px;
          padding: 10px 20px;
          font-size: 14px;
      }

      h2 {
          text-align: center;
          margin-bottom: 20px;
      }
  </style>
<!-- Success/Error Message -->
<div class="topcorner" style="position:absolute; top:80px;right:0; z-index:1000;">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} m-2" role="alert">
          <strong>{{ message }}</strong>
        </div>
      {% endfor %}
    {% endif %}
  </div>
  
  <!-- Update Form -->
  <form class="tm-edit-product-form" method="post" action="{% url 'updateeventdetails' %}">
    {% csrf_token %}
    
    <div class="form-group mb-3">
      <label for="name">Enter Full Name</label>
      <input id="name" name="name" type="text" value="{{ name }}" class="form-control validate" required />
    </div>
  
    <div class="form-group mb-3">
      <label for="eventname">Event Name</label>
      <input id="eventname" name="eventname" type="text" value="{{ eventname }}" class="form-control validate" required />
    </div>
  
    <div class="form-group mb-3">
      <label for="email">Enter Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" class="form-control validate" required />
    </div>
  
    <div class="form-group mb-3">
      <label for="date">Enter Event Date</label>
      <input id="date" name="date" type="date" value="{{ date }}" class="form-control validate" required />
    </div>
  
    <div class="form-group mb-3">
      <label for="mobile">Enter Mobile Number</label>
      <input id="mobile" name="mobile" type="text" value="{{ mobile }}" class="form-control validate" required />
    </div>
  
    <div class="form-group mb-3">
      <label for="altmobile">Enter Alternate Mobile Number</label>
      <input id="altmobile" name="altmobile" type="text" value="{{ altmobile }}" class="form-control validate" required />
    </div>
  
    <div class="form-group mb-3">
      <label for="amount">Enter Amount You Can Afford</label>
      <input id="amount" name="amount" type="text" value="{{ amount }}" class="form-control validate" required />
    </div>
  
    <div class="form-group mb-3">
      <label for="description">Enter Description about Event</label>
      <textarea id="description" name="description" class="form-control validate" rows="3" required>{{ description }}</textarea>
    </div>
  
    <div class="col-12 text-center mt-3">
      <button type="submit" class="btn btn-success btn-lg text-uppercase">Update Booking Details</button>
    </div>
  </form>
